name: Build and release desktop apps

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-release.yml"
      - "studio.py"
      - "qr_engine.py"
      - "pixel_mosaic.py"
      - "requirements*.txt"
      - "PolarLabs-QR.ico"
      - "PolarLabs-QR.png"
      - "tests/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.display }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            os: windows
            arch: x64
            display: Windows x64
          - runner: windows-11-arm
            os: windows
            arch: arm64
            display: Windows ARM64
          - runner: ubuntu-22.04
            os: linux
            arch: x64
            display: Linux x64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
            display: Linux ARM64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Linux GUI libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth patchelf libx11-6 libxrender1 libxext6
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Verify dependencies and architecture
        run: python scripts/check_environment.py ${{ matrix.arch }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PolarLabs-QR-Studio --icon PolarLabs-QR.ico --add-data "PolarLabs-QR.ico;." --add-data "PolarLabs-QR.png;." --collect-all customtkinter --collect-all resvg_py --collect-all zxingcpp studio.py
      - name: Build Linux executable
        if: matrix.os == 'linux'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile \
            --name PolarLabs-QR-Studio \
            --add-data "PolarLabs-QR.ico:." \
            --add-data "PolarLabs-QR.png:." \
            --collect-all customtkinter \
            --collect-all resvg_py \
            --collect-all zxingcpp \
            studio.py
      - name: Smoke-test GUI and bundled executable (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: python scripts/smoke_gui.py --windows
      - name: Smoke-test GUI and bundled executable (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: xvfb-run -a python scripts/smoke_gui.py --linux
      - name: Package distribution
        run: python scripts/package.py --version 1.1.0 --os ${{ matrix.os }} --arch ${{ matrix.arch }}
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: polarlabs-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish free v1.1.0 downloads
    needs: build
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: polarlabs-*
          path: release-assets
          merge-multiple: true
      - name: Validate archives, generate checksums
        shell: bash
        run: |
          python scripts/check_release.py release-assets
          cd release-assets
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.0 >/dev/null 2>&1 || \
            gh release create v1.1.0 --target "$GITHUB_SHA" \
              --title "PolarLabs QR Studio v1.1.0 — Windows & Linux" \
              --notes-file RELEASE_NOTES.md
          gh release upload v1.1.0 release-assets/*.zip release-assets/*.tar.gz release-assets/SHA256SUMS.txt --clobber
          gh release view v1.1.0 --json url,assets
